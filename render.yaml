databases:
  - name: finance-freedom-db
    databaseName: financefreedom
    user: financefreedom
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: finance-freedom
    runtime: docker
    region: virginia
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: PORT
        value: "10000"
      - key: Database__Provider
        value: Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: finance-freedom-db
          property: connectionString
      - key: Advertising__PublisherId
        value: ca-pub-2320073237892936
